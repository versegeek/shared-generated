# Copied to python/ in shared-generated by the generate-grpc-python job.
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "shared-generated"
description = "Generated Python code for the API contracts"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
  # At least the "Protobuf Python Version" in the header of the generated *_pb2.py
  # files; update it together with buf.build/protocolbuffers/python in buf.gen.yaml.
  "protobuf>=7.36.2",
  # The buf.build/grpc/python version in buf.gen.yaml
  "grpcio>=1.84.0",
  # google.api annotations; the first release that allows protobuf 7
  "googleapis-common-protos>=1.73.1",
]

# The version comes from the Git history of shared-generated (0.0.1.devN, where N
# is the number of commits), so every publish raises it without editing this file.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", local_scheme = "no-local-version", fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
# Install grpc/{domain} as top-level packages, e.g. identity.v1
only-include = ["grpc"]
sources = ["grpc"]
